name: Stock Monitor

on:
  schedule:
    # Runs every 15 minutes. GitHub's free scheduler isn't second-precise —
    # actual runs can lag a few minutes during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated cooldown state files back

jobs:
  check-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check (whole watchlist, one run)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          # STOCKS repo variable (JSON list) feeds the script's WATCHLIST env var —
          # edit the STOCKS variable in Settings > Secrets and variables > Actions
          # to add/remove tickers, no code changes needed.
          WATCHLIST: ${{ vars.STOCKS }}
        run: |
          python stock_monitor.py --once --ignore-market-hours

      - name: Save cooldown state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add alert_state_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update alert cooldown state [skip ci]"
          git diff --staged --quiet || git push
