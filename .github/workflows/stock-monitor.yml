name: Stock Monitor

on:
  schedule:
    # Runs every 15 minutes. GitHub's free scheduler isn't second-precise —
    # actual runs can lag a few minutes during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated cooldown state file back

jobs:
  check-stock:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # run one stock at a time so state-file commits/pushes don't collide
      matrix:
        stock: ${{ fromJson(vars.STOCKS) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python stock_monitor.py \
            --ticker "${{ matrix.stock.ticker }}" \
            --target-price "${{ matrix.stock.target_price }}" \
            --volume-multiplier "${{ matrix.stock.volume_multiplier }}" \
            --once

      - name: Save cooldown state
        run: |
          STATE_FILE="alert_state_$(echo '${{ matrix.stock.ticker }}' | tr '[:lower:]' '[:upper:]').json"
          if [ -f "$STATE_FILE" ]; then
            git config user.name "stock-monitor-bot"
            git config user.email "actions@github.com"
            git pull --rebase
            git add "$STATE_FILE"
            git diff --staged --quiet || git commit -m "Update alert cooldown state for ${{ matrix.stock.ticker }} [skip ci]"
            git push
          else
            echo "No $STATE_FILE yet (no alert has fired) — nothing to commit."
          fi
